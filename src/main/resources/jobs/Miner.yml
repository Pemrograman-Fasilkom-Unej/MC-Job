name: Miner
theme:
- Ore Extraction
- Underground Mastery
- Efficiency
xp_triggers:
- Mine ores
- Smelt ores
- Discover new cave areas
- Break stone-type blocks
requirements: []
bonuses:
  generic.armor: 1.0
  generic.max_health: 2.0
skills:
  Builder:
    type: Active
    category: Utility
    description: Right-click two same blocks with shovel to auto-fill area using materials from inventory.
    activation_text: "Trigger via Skill Hotbar (Shift+F)"
    max_level: 5
    points_per_level: 2
    toggleable: false
    trigger_item: IRON_SHOVEL
    cooldown: 5
  Breaker:
    type: Active
    category: Utility
    description: Right-click two same blocks with pickaxe to break connected blocks at durability cost.
    activation_text: "Trigger via Skill Hotbar (Shift+F)"
    max_level: 5
    points_per_level: 2
    toggleable: false
    trigger_item: IRON_PICKAXE
    cooldown: 5
  Vein Master:
    type: Passive
    category: Utility
    description: Chance to mine entire ore vein instantly.
    preview_text: "Chance to trigger is {chance}%"
    max_level: 5
    points_per_level: 1
    toggleable: true
    trigger_item: DIAMOND_ORE
    chance_per_level: 20.0
    max_chance: 100.0
  Stone Guard:
    type: Passive
    category: Defense
    description: Gain damage resistance while underground (based on Y-level).
    max_level: 5
    points_per_level: 1
    toggleable: false
    trigger_item: COBBLESTONE
rewards:
  Mine ores: 15
  Smelt ores: 5
  Discover new cave areas: 50
  Break stone-type blocks: 1
